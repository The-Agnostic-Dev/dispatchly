[package]
name = "dispatchly"
version = "0.4.2"
edition = "2024"
rust-version = "1.90"
description = "Delivery dispatch board for Dispatchly's Lagos rider fleet"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
minijinja = { version = "2", features = ["loader", "json", "urlencode"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[profile.dev.package."*"]
opt-level = 1
